<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page Not Found</title>
<style>
  :root { color-scheme: light dark; --bg: #fbfaf8; --ink: #1c1917; --link: #c2410c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161412; --ink: #f5f5f4; --link: #fb923c; } }
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; padding: 16px; background: var(--bg); color: var(--ink); font: 17px/1.6 "Segoe UI", system-ui, sans-serif; }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>That page doesn't exist.</h1>
  <p>Use your browser's back button, or go to the <a id="home" href="/">home page</a>.</p>
</main>
<script>
  // On GitHub Pages the site lives under /<repo>/, so home is the first path segment.
  if (location.hostname.endsWith("github.io")) {
    document.getElementById("home").href = "/" + location.pathname.split("/")[1] + "/";
  }
</script>
</body>
</html>
